name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ChurchTranslate.sln
      - run: dotnet build ChurchTranslate.sln --no-restore --configuration Release
      - run: dotnet test ChurchTranslate.sln --no-build --configuration Release

